<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <script src="ventas.js"></script>
    <script src="utilitarios.js"></script>
</head>

<body>

    <div class="contenedor">
        <h1>Calculadora de Comisiones</h1>

        <label>Salario Base:</label>
        <input type="text" id="txtSueldoBase" onblur="validarNumero('txtSueldoBase')">
        <span id="errorSueldoBase" class="mensaje-error"></span>

        <label>Número de ventas:</label>
        <input type="text" id="txtVentas" onblur="validarNumero('txtVentas')">
        <span id="errorVentas" class="mensaje-error"></span>

        <label>Precio del producto:</label>
        <input type="text" id="txtPrecio" onblur="validarNumero('txtPrecio')">
        <span id="errorPrecio" class="mensaje-error"></span>

        <button onclick="calcular()">Calcular Comisión</button>

        <h2>Resultados</h2>
        <p>Salario Base: <span id="spSueldoBase"></span></p>
        <p>Comisión: <span id="spComision"></span></p>
        <p>Total: <span id="spTotal"></span></p>
    </div>


</body>

</html>
